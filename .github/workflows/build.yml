name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baseline check
        run: |
          pip install --quiet detect-secrets
          detect-secrets scan --baseline .secrets.baseline

  build:
    name: Build
    runs-on: windows-latest
    needs: detect-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore IncendiaryService.sln
      - name: Build
        run: dotnet build IncendiaryService.sln --no-restore --configuration Release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect-secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore IncendiaryService.Tests/IncendiaryService.Tests.csproj
      - name: Test
        run: dotnet test IncendiaryService.Tests/IncendiaryService.Tests.csproj --no-restore --verbosity normal
